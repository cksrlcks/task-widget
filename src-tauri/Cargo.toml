[package]
name = "task-widget"
version = "0.1.4"
description = "Task Widget"
authors = ["chang"]
edition = "2024"

[lib]
name = "task_widget_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"

# 클립보드 섹션: Windows는 시스템 기록(Win+V) API, 그 밖은 텍스트를 직접 읽는다
[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = ["ApplicationModel_DataTransfer", "Foundation", "Foundation_Collections", "Win32_System_Com", "Win32_System_DataExchange", "Graphics_Imaging", "Storage_Streams", "Security_Cryptography"] }

[target."cfg(not(windows))".dependencies]
arboard = { version = "3.7.0", default-features = false }

[profile.release]
lto = "thin"
opt-level = 3
panic = "abort"
strip = true
