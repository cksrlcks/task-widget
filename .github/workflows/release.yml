# v* 태그를 푸시하면 Windows 설치 파일을 빌드·서명해 GitHub Release로 올린다.
# 필요한 시크릿: TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD, VITE_PB_URL (docs/release.md 참고)
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_PB_URL: ${{ secrets.VITE_PB_URL }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Task Widget ${{ github.ref_name }}
          releaseBody: 변경 사항은 커밋 내역을 참고하세요.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
